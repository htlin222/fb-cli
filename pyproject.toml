[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fb-pages-cli"
version = "0.1.0"
description = "Facebook Pages CLI via official Graph API + Cloudflare Worker OAuth relay. Sibling of threads-cli."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "htlin222" }]
keywords = ["facebook", "graph-api", "cli", "pages", "cloudflare-worker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[project.scripts]
fb-cli = "fb:main"

[project.urls]
Homepage = "https://github.com/htlin222/fb-cli"
Repository = "https://github.com/htlin222/fb-cli"
Issues = "https://github.com/htlin222/fb-cli/issues"

[tool.hatch.build.targets.wheel]
only-include = ["fb.py", "fb_lib.py"]

[tool.hatch.build.targets.sdist]
include = [
    "/fb.py",
    "/fb_lib.py",
    "/tests",
    "/README.md",
    "/CLAUDE.md",
    "/Makefile",
    "/cloudflare-worker",
    "/docs",
    "/pytest.ini",
    "/.env.example",
]
